<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image Captioning</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Montserrat', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    .card-upload {
      background: rgba(255, 255, 255, 0.9);
      border: none;
      border-radius: 1rem;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
    }
    .btn-primary {
      background-color: #764ba2;
      border: none;
    }
    .btn-primary:hover {
      background-color: #5a3490;
    }
    .preview-img {
      max-width: 100%;
      border-radius: 0.5rem;
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
      margin-top: 1rem;
    }
    .caption-text {
      font-size: 1.1rem;
      font-weight: 600;
      color: #333;
      margin-top: 1rem;
    }
  </style>
</head>
<body>
  <div class="card card-upload p-4" style="width: 100%; max-width: 500px;">
    <div class="text-center mb-4">
      <h2 class="fw-bold">Image Captioning</h2>
      <p class="text-muted">Upload an image and get an instant caption!</p>
    </div>
    <form action="/" method="POST" enctype="multipart/form-data">
      <div class="mb-3">
        <label for="image" class="form-label">Choose your image</label>
        <input class="form-control" type="file" id="image" name="image" accept="image/*" required onchange="previewImage(event)">
      </div>
      <button type="submit" class="btn btn-primary w-100 py-2">Generate Caption</button>
    </form>
    {% if image_path %}
    <div class="text-center">
      <img id="preview" src="{{ url_for('static', filename='uploads/' + image_path.split('/')[-1]) }}" alt="Uploaded Image" class="preview-img">
      <p class="caption-text">{{ caption }}</p>
    </div>
    {% else %}
    <div class="text-center">
      <img id="preview" src="#" alt="" class="preview-img d-none">
    </div>
    {% endif %}
  </div>

  <!-- Bootstrap JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    function previewImage(event) {
      const input = event.target;
      const reader = new FileReader();
      reader.onload = function(){
        const dataURL = reader.result;
        const preview = document.getElementById('preview');
        preview.src = dataURL;
        preview.classList.remove('d-none');
      };
      reader.readAsDataURL(input.files[0]);
    }
  </script>
</body>
</html>
